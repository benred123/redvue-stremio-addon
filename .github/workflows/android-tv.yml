name: REDVUE Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Fire TV / Android TV debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout REDVUE
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 35 platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Record Android build environment
        run: |
          {
            echo "Java:"
            java -version 2>&1
            echo "Gradle:"
            gradle --version
            echo "Android SDK path: ${ANDROID_HOME:-unset}"
            echo "Project files:"
            ls -la android-tv/
            echo "Gradle project:"
            ls -la android-tv/app/
          } > android-build-environment.txt 2>&1
          cat android-build-environment.txt
      # Debug builds were previously signed with a fresh key every run,
      # which prevents adb install -r from upgrading the previous APK.
      # Cache this test-only debug keystore for consistent beta updates.
      - name: Cache REDVUE debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: redvue-firetv-debug-keystore-v1
      - name: Compile REDVUE debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-tv --no-daemon --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee android-build.log
      - name: Upload REDVUE APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REDVUE-FireTV-debug-APK
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload REDVUE build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REDVUE-Android-build-diagnostics
          path: |
            android-build.log
            android-build-environment.txt
          if-no-files-found: warn
          retention-days: 14
