name: REDVUE Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Fire TV / Android TV debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout REDVUE
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile REDVUE debug APK
        run: gradle -p android-tv --no-daemon :app:assembleDebug
      - name: Upload REDVUE APK
        uses: actions/upload-artifact@v4
        with:
          name: REDVUE-FireTV-debug-APK
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
